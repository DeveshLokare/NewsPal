server:
  # Render tells the service which port to listen on.
  port: ${PORT:8080}
  # Render terminates HTTPS in front of the app.
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: newspal
  datasource:
    # Local defaults match docker-compose.yml; override with SPRING_DATASOURCE_* env vars (Neon in production).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/newspal}
    username: ${SPRING_DATASOURCE_USERNAME:newspal}
    password: ${SPRING_DATASOURCE_PASSWORD:newspal}
    hikari:
      # Let Neon scale to zero when idle (SPEC §9.5).
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
      keepalive-time: 0
      connection-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      # Render's health check must not wake the database.
      enabled: false

newspal:
  jwt:
    secret: ${JWT_SECRET}
    ttl: P7D
  news:
    # Free News API allows 5,000 requests/day; each new article costs a list share plus
    # one /details call (SPEC-v2 §4.5). Every category is refreshed about every 2 hours.
    refresh-ttl: PT1H50M
    # Must exceed refresh-ttl or feeds empty out between refreshes.
    retention: P7D
    max-per-category: 1000
    summary-max-chars: 500
    # List pages (10 articles each) fetched per category per refresh.
    max-list-pages: 3
    quota:
      # Provider calls per UTC day; 400 of the 5,000 are left as margin.
      ingestion-daily: 3600
      older-daily: 1000
    older:
      cache-ttl: PT1H
      per-user-daily: 10
      max-age: P30D
  freenews:
    base-url: https://api.freenewsapi.io/v1
    # Leave empty to run without fetching news (no quota is used).
    api-key: ${FREENEWS_API_KEY:}
    language: en
    # Empty: English news from all countries.
    country:
    timeout: PT10S
    # The API allows 2 requests per second.
    min-interval: PT0.55S
    # Pause until the daily reset when the API reports fewer requests left than this.
    min-remaining: 100
  jobs:
    # Shared with the GitHub Actions workflow that calls POST /api/internal/jobs/run
    # every 2 hours (.github/workflows/jobs.yml). Empty disables that endpoint.
    token: ${JOB_TOKEN:}
    # Cleanup runs at most once in this window, whichever trigger gets there first.
    cleanup-every: PT23H
  scheduling:
    enabled: true
