spring:
  application:
    name: newspal
  datasource:
    # Local defaults match docker-compose.yml; override with SPRING_DATASOURCE_* env vars (Neon in production).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/newspal}
    username: ${SPRING_DATASOURCE_USERNAME:newspal}
    password: ${SPRING_DATASOURCE_PASSWORD:newspal}
    hikari:
      # Let Neon scale to zero when idle (SPEC §9.5).
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
      keepalive-time: 0
      connection-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      # Render's health check must not wake the database.
      enabled: false

newspal:
  jwt:
    secret: ${JWT_SECRET}
    ttl: P7D
  news:
    # 8 categories x 3 refreshes/day x 30 days = 720 calls (SPEC §4.2)
    refresh-ttl: PT8H
    retention: P3D
    max-per-category: 200
    summary-max-chars: 500
    quota:
      ingestion-monthly: 720
      older-monthly: 250
  webz:
    base-url: https://api.webz.io
    endpoint: /newsApiLite
    # Leave empty to run without fetching news (no quota is used).
    token: ${WEBZ_TOKEN:}
    timeout: PT10S
  scheduling:
    enabled: true
