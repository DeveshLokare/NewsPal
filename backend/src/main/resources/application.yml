spring:
  application:
    name: newspal
  datasource:
    # Local defaults match docker-compose.yml; override with SPRING_DATASOURCE_* env vars (Neon in production).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/newspal}
    username: ${SPRING_DATASOURCE_USERNAME:newspal}
    password: ${SPRING_DATASOURCE_PASSWORD:newspal}
    hikari:
      # Let Neon scale to zero when idle (SPEC §9.5).
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
      keepalive-time: 0
      connection-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      # Render's health check must not wake the database.
      enabled: false

newspal:
  jwt:
    secret: ${JWT_SECRET}
    ttl: P7D
  news:
    # webz.io /api/news bills ~0.06 credit per 10-post call; ~5.00 credit/month = ~83 calls (SPEC §4.2).
    # 8 categories refreshed every 3.5 days = ~69 calls/month.
    refresh-ttl: PT84H
    # Must exceed refresh-ttl or feeds empty out between refreshes.
    retention: P7D
    max-per-category: 200
    summary-max-chars: 500
    quota:
      ingestion-monthly: 68
      older-monthly: 8
    older:
      cache-ttl: PT1H
      per-user-daily: 10
      max-age: P30D
  webz:
    base-url: https://api.webz.io
    endpoint: /api/news
    # Leave empty to run without fetching news (no quota is used).
    token: ${WEBZ_TOKEN:}
    timeout: PT10S
    # webz.io returns HTTP 429 for back-to-back calls.
    min-interval: PT2S
    # Stop calling for the rest of the month once webz.io reports a balance below this.
    min-balance: 0.30
  scheduling:
    enabled: true
